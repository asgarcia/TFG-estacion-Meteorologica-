---
name: "weewx"

services:
  apache:
    image: httpd:2.4
    restart:  unless-stopped
    volumes:
      - ./data/public_html:/usr/local/apache2/htdocs
    ports:
      - "8080:80"

  db:
    image: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: weewx
      MYSQL_DATABASE: weewx
      MYSQL_USER: weewx
      MYSQL_PASSWORD: weewx
    volumes:
      - ./data/db_data:/var/lib/mysql

  weewx:
    image: felddy/weewx:5
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./data/weewx.conf:/home/weewx/weewx.conf
      - ./data/public_html:/home/weewx/public_html
    ports:
      - "21:21"
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    privileged: true

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
